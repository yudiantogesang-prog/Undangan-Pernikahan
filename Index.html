<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan - Rizky & Aulia</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-stone-50 text-stone-800 flex justify-center">

    <div class="w-full max-w-md min-h-screen bg-white shadow-2xl relative overflow-hidden flex flex-col items-center justify-between p-6 text-center">
        
        <!-- Header Section -->
        <div class="my-auto space-y-4">
            <p class="text-xs tracking-widest uppercase text-stone-500">The Wedding Of</p>
            <h1 class="font-serif text-4xl italic text-stone-900">Rizky & Aulia</h1>
            <p class="text-sm text-stone-600">Minggu, 15 Desember 2026</p>
            
            <div class="pt-6">
                <span class="block text-xs text-stone-400 mb-1">Kepada Yth. Bapak/Ibu/Saudara/i</span>
                <h2 id="guest-name" class="font-semibold text-lg text-stone-800 bg-stone-100 py-2 px-4 rounded-full inline-block">Tamu Undangan</h2>
            </div>
        </div>

        <!-- Action Button -->
        <div class="w-full pb-8">
            <a href="#content" class="w-full block bg-stone-900 text-white py-3 rounded-full font-medium tracking-wide shadow-lg hover:bg-stone-800 transition">
                Buka Undangan
            </a>
        </div>

    </div>

    <!-- Script untuk mengambil nama tamu dari URL (Contoh: ?to=Budi) -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tamu = urlParams.get('to');
        if (tamu) {
            document.getElementById('guest-name').textContent = decodeURIComponent(tamu);
        }
    </script>
</body>
</html>
